[project]
name = "event-arb"
version = "0.1.0"
description = "Safety-first cross-venue prediction-market arbitrage scanner (Kalshi / Polymarket)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "httpx>=0.28",
    "websockets>=13.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "jinja2>=3.1",
    "cryptography>=43.0",
    "rapidfuzz>=3.10",
    "python-dateutil>=2.9",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
]

[project.scripts]
event-arb = "event_arb.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_arb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N806"]
# Alembic autogenerates these; reformatting them obscures the diff against the model.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["event_arb"]

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: optional read-only tests that hit real venue APIs (deselected by default)",
]
filterwarnings = ["error::DeprecationWarning:event_arb.*"]
