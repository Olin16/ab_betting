# Type checking for the test suite.
#
# The app is checked by [tool.mypy] in pyproject.toml, which sets packages = ["event_arb"]
# and therefore never looks at tests/. Rather than widen that config — which would drag
# test-only relaxations into the application's strictness — tests get their own pass here.
#
# Strictness is deliberately the same as the app's. The only relaxations are the two that
# are about pytest's own shape rather than about type safety:
#
#   disallow_untyped_decorators — @pytest.fixture and @pytest.mark.parametrize are untyped
#   warn_unused_ignores         — a `type: ignore` needed on one Python/pytest version is
#                                 reported as unused on another, which makes the pass
#                                 fail for reasons unrelated to the code
#
# Everything else — no implicit Any, no untyped defs, no unchecked bodies — still applies,
# because a test that silently types as Any can assert nothing and still pass.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
plugins = pydantic.mypy
mypy_path = src
files = tests
disallow_untyped_decorators = False
warn_unused_ignores = False

[mypy-rapidfuzz.*]
ignore_missing_imports = True

[mypy-prometheus_client.*]
ignore_missing_imports = True
